name: Security (reusable)

# Reusable security scan — roda em todos os tiers (app/service/lib/iac/content/docs).
# Core: gitleaks (secret scanning) via BINÁRIO direto — sem o gitleaks-action,
# que faz chamadas à API do GitHub (comentários/PR) e exige permissões extras +
# licença em orgs. Rodar o binário é least-privilege (só contents:read), sem
# dependência de API, e falha o CI no exit code se achar segredo.
#
# OIDC, CodeQL/Semgrep e dependency-review entram em fases futuras (SAST só nos
# repos que tocam dados de usuário: xreset + api).

on:
  workflow_call:
    inputs:
      full-history:
        description: "Varrer todo o histórico git (fetch-depth 0)"
        type: boolean
        default: true
      gitleaks-version:
        description: "Versão do gitleaks"
        type: string
        default: "8.24.3"

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # String '0'/'1' — em expressão GH, 0 é falsy e quebraria `&& 0 || 1`.
          fetch-depth: ${{ inputs.full-history && '0' || '1' }}

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER="${{ inputs.gitleaks-version }}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Baseline gitleaks config (se o repo não tiver o seu)
        run: |
          set -euo pipefail
          if [ -f .gitleaks.toml ] || [ -f gitleaks.toml ]; then
            echo "Repo tem .gitleaks.toml — usando o dele."
          else
            cat > /tmp/gitleaks-baseline.toml <<'TOML'
          title = "SAPIANS gitleaks baseline"
          [extend]
          useDefault = true
          # Arquivos de exemplo/template contêm placeholders (chaves vazias), não segredos.
          [allowlist]
          description = "Example/sample/template files"
          paths = [
            '''(^|/)\.env\.example$''',
            '''(^|/)\.env\.sample$''',
            '''.*\.example$''',
            '''.*\.sample$''',
            '''.*\.template$''',
          ]
          TOML
            echo "GITLEAKS_CONFIG=/tmp/gitleaks-baseline.toml" >> "$GITHUB_ENV"
          fi

      - name: Scan git history for secrets
        run: gitleaks git . --redact --no-banner --verbose ${GITLEAKS_CONFIG:+--config "$GITLEAKS_CONFIG"}
