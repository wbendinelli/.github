name: CI · Terraform (reusable)

# Reusable CI para repos IaC (Terraform). Gates ESTÁTICOS — nenhum precisa de
# credencial de cloud, então roda em qualquer PR com segurança.
#
# `validate` SEMPRE bloqueia (correção real). fmt/tflint/checkov seguem o
# ratchet: com `strict: false` (adoção) rodam como report (continue-on-error);
# com `strict: true` bloqueiam. Apertar conforme o repo é limpo.
#
# `strict-fmt` permite apertar SÓ o fmt (gate trivial, zero falso-positivo)
# mantendo tflint/checkov em report — o degrau natural do ratchet antes do
# strict total. fmt bloqueia se `strict` OU `strict-fmt`.
#
# `terraform plan` em PR exige OIDC (Workload Identity Federation) → fase futura.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Diretório do root module (ex: environments/prod)"
        type: string
        default: "environments/prod"
      terraform-version:
        description: "Versão do Terraform"
        type: string
        default: "1.9.8"
      strict:
        description: "fmt/tflint/checkov bloqueiam? (false = report/adoção)"
        type: boolean
        default: true
      strict-fmt:
        description: "Só o fmt bloqueia (degrau do ratchet); tflint/checkov seguem strict"
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  static:
    name: fmt + validate + tflint + checkov
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        continue-on-error: ${{ !(inputs.strict || inputs.strict-fmt) }}

      - name: Terraform init (no backend)
        working-directory: ${{ inputs.working-directory }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ inputs.working-directory }}
        run: terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Run tflint
        run: tflint --recursive
        continue-on-error: ${{ !inputs.strict }}

      - name: Checkov (IaC misconfig scan)
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: ${{ !inputs.strict }}
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: ${{ !inputs.strict }}
