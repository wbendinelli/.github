name: Docs lint (self)

on:
  push:
    branches: [main]
    paths: ["README.md", "scripts/**", "doclint/**", "test/**", ".sapians-repo.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doclint:
    name: doclint (self)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: doclint no próprio repo (smoke)
        run: node scripts/doclint.mjs . --format github

      # Teste de COMPORTAMENTO das ferramentas, não do README deste repo.
      # A asserção de concordância entre doclint e brand-lint é a que pega
      # divergência de regra entre as duas — o defeito de 2026-08-30.
      - name: selftest das ferramentas (marca · doclint × brand-lint)
        run: node scripts/selftest.mjs
