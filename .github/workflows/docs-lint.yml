name: Docs lint

on:
  workflow_call:
    inputs:
      path:
        description: "Diretório a validar"
        type: string
        default: "."
      format:
        description: "human | github | json"
        type: string
        default: "github"
      config-ref:
        description: "Ref (tag ou SHA) de wbendinelli/.github de onde vem o doclint. Obrigatorio."
        type: string
        # OBRIGATORIO, e sem default. O default anterior era "main", e o
        # reusable faz checkout DESTE repositorio na ref recebida para rodar o
        # script e ler as regras: quem nao passava o input baixava ferramenta e
        # regra do HEAD de main a cada run. O `uses:` vinha da tag; o criterio
        # de aprovacao vinha do branch. Oito callers estavam nessa situacao.
        #
        # Exigir e melhor que eleger uma tag como default: default envelhece e
        # vira a proxima mentira. Assim, esquecer quebra na hora, em vez de
        # passar despercebido por meses.
        required: true

permissions:
  contents: read

jobs:
  doclint:
    name: doclint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório validado
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout da config central
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: wbendinelli/.github
          ref: ${{ inputs.config-ref }}
          path: .doclint-bin

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: doclint
        run: node .doclint-bin/scripts/doclint.mjs "${{ inputs.path }}" --format "${{ inputs.format }}"
