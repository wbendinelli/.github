name: CI · Python (reusable)

# Reusable CI para repos Python (ruff + mypy + pytest). Extraído do CI de
# referência do sapians-api. Política de gate:
#   - ruff   = SEMPRE bloqueante (lint limpo).
#   - mypy   = report por padrão (gradual typing); vira bloqueante por input.
#   - pytest = report por padrão (integração precisa de creds); bloqueante por input.
# O ratchet (report → block) é um estado de migração documentado, não permanente.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Versão do Python"
        type: string
        default: "3.12"
      install-target:
        description: "Alvo do pip install -e (ex: '.[dev]')"
        type: string
        default: ".[dev]"
      mypy-path:
        description: "Caminho pro mypy (ex: api/app). Vazio = pula mypy."
        type: string
        default: ""
      mypy-blocking:
        description: "mypy bloqueia o CI?"
        type: boolean
        default: false
      pytest-marker:
        description: "Marcador do pytest (ex: 'not integration')"
        type: string
        default: "not integration"
      pytest-blocking:
        description: "pytest bloqueia o CI?"
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e '${{ inputs.install-target }}'

      - name: Lint (ruff) — bloqueante
        run: ruff check .

      - name: Typecheck (mypy)
        if: ${{ inputs.mypy-path != '' }}
        run: mypy ${{ inputs.mypy-path }}
        continue-on-error: ${{ !inputs.mypy-blocking }}

      - name: Test (pytest)
        run: pytest -m "${{ inputs.pytest-marker }}"
        continue-on-error: ${{ !inputs.pytest-blocking }}
