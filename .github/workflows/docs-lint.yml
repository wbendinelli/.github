name: Docs lint

on:
  workflow_call:
    inputs:
      path:
        description: "Diretório a validar"
        type: string
        default: "."
      format:
        description: "human | github | json"
        type: string
        default: "github"
      config-ref:
        description: "Ref de wbendinelli/.github de onde vem o doclint. Pinar em tag."
        type: string
        # SEM default "main". O default era o defeito: o `uses:` vinha da tag e a
        # REGRA vinha do HEAD de main, a cada run, em todo caller que nao passava
        # o input — o pin era decorativo justamente para o criterio de aprovacao.
        # Vazio faz o checkout usar `job_workflow_sha`, o commit DESTE reusable:
        # ferramenta e regra viajam sempre juntas, sem ninguem precisar lembrar.
        default: ""

permissions:
  contents: read

jobs:
  doclint:
    name: doclint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório validado
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout da config central
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: wbendinelli/.github
          ref: ${{ inputs.config-ref || github.job_workflow_sha }}
          path: .doclint-bin

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: doclint
        run: node .doclint-bin/scripts/doclint.mjs "${{ inputs.path }}" --format "${{ inputs.format }}"
