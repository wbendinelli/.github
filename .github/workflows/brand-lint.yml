name: Brand lint (reusable)

# Guardrail de marca: "SAPIANS" é sempre caixa-alta em prosa.
#
# A regra vive em UM lugar — `doclint/rules/brand.json` no repositório de config
# central — e este workflow faz checkout dele para rodar o script canônico.
# Antes havia três cópias do regex (validate.ts, brand-lint.mjs e uma inline
# aqui, que era o gate real e tinha denylist menor). Divergiam.
#
# Para citar a grafia errada de propósito (ADR, evidência histórica), marque a
# linha com `brand-lint-ignore`.

on:
  workflow_call:
    inputs:
      config-ref:
        description: "Ref (tag ou SHA) de wbendinelli/.github de onde vem a regra de marca. Obrigatorio."
        type: string
        # OBRIGATORIO, e sem default. O default anterior era "main", e o
        # reusable faz checkout DESTE repositorio na ref recebida para rodar o
        # script e ler as regras: quem nao passava o input baixava ferramenta e
        # regra do HEAD de main a cada run. O `uses:` vinha da tag; o criterio
        # de aprovacao vinha do branch. Oito callers estavam nessa situacao.
        #
        # Exigir e melhor que eleger uma tag como default: default envelhece e
        # vira a proxima mentira. Assim, esquecer quebra na hora, em vez de
        # passar despercebido por meses.
        required: true

defaults:
  run:
    shell: bash

jobs:
  brand-lint:
    name: brand-lint (.md prose)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout do repositório validado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout da config central
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wbendinelli/.github
          ref: ${{ inputs.config-ref }}
          path: .brand-lint-bin

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Lint brand casing
        run: node .brand-lint-bin/scripts/brand-lint.mjs .
